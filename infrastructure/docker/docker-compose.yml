name: predictive-maintenance-platform

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: predictive-maintenance-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:?MSSQL_PASSWORD must be set}
    ports:
      - "${SQL_SERVER_PORT:-1433}:1433"
    volumes:
      - sql-server-data:/var/opt/mssql
    networks:
      - predictive-maintenance-network
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ml-service:
    container_name: predictive-maintenance-ml
    build:
      context: ../../ml-service
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      DEBUG: ${ML_DEBUG:-false}
      LOG_LEVEL: ${ML_LOG_LEVEL:-INFO}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    networks:
      - predictive-maintenance-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backend-api:
    container_name: predictive-maintenance-api
    build:
      context: ../../backend/PredictiveMaintenance
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Server=sql-server,1433;Database=${MSSQL_DATABASE:-PredictiveMaintenance};User Id=sa;Password=${MSSQL_PASSWORD};TrustServerCertificate=True;
      MlService__BaseUrl: http://ml-service:8000
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-5001}:8080"
    networks:
      - predictive-maintenance-network
    depends_on:
      sql-server:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    container_name: predictive-maintenance-frontend
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-5001}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - predictive-maintenance-network
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  predictive-maintenance-network:
    name: predictive-maintenance-network
    driver: bridge

volumes:
  sql-server-data:
    name: predictive-maintenance-sql-data
